<script>
/* ===== Βασικά ===== */
const DAY=864e5,T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})(),addD=n=>new Date(T0.getTime()+n*DAY);
const DN=['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'],DNF=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];

const fmtD=n=>{const d=addD(n);return DN[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)};
const relD=n=>n===0?'σήμερα':n===1?'αύριο':fmtD(n);
const eur=v=>(v<0?'−':'')+Math.abs(v).toFixed(2).replace('.',',')+' €';
const eur0=v=>Math.round(v).toLocaleString('el-GR')+' €';
const sum=a=>a.reduce((x,y)=>x+y,0);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260929);

/* ===== Προμηθευτές & προϊόντα ===== */
const SUP={
 gs:{name:'Golden Sandwich',days:[1,2,3,4,5,6],lead:1,cut:'14:00',color:'var(--gs)'},

 {id:'ra4',s:'ra',n:'Mini Brownies σοκολάτα (6 τεμ.)',b:3,cost:1.1,price:2.1,shelf:10,trend:0},

 {id:'it2',s:'it',n:'Ποτήρια bamboo κρύου 16oz',b:520,pack:1000,packN:'κιβ. 1000',cost:80},

 {id:'kv1',s:'kv',n:'Νερό 500ml',b:28,pack:24,packN:'κιβ. 24',cost:4.8,price:.6},
 {id:'kv2',s:'kv',n:'Coca-Cola 330ml',b:9,pack:24,packN:'κιβ. 24',cost:9.6,price:1.7},

 {id:'kv4',s:'kv',n:'Monster Green 500ml',b:4,pack:12,packN:'κιβ. 12',cost:13.2,price:2.1}];
const PM=Object.fromEntries(P.map(p=>[p.id,p])),per=p=>!!p.shelf;
const DOW_S=[.55,1.05,1,1.05,1.1,1.1,.7],DOW_O=[.8,1,1,1,1.05,1.1,.9],COF_PRICE=2.45;

/* ===== Καιρός & αργίες (demo) ===== */
const WX=[{t:29},{t:31},{t:30},{t:23,rain:1},{t:25},{t:27},{t:28}];
const HOL=['1-1','1-6','3-25','5-1','8-15','10-28','12-25','12-26'];
const isHol=n=>{const d=addD(n);return HOL.includes((d.getMonth()+1)+'-'+d.getDate())};
function wxF(p,n){let f=1;if(n<0)return 1;if(isHol(n))f*=per(p)?.6:.75;const w=WX[n];if(!w)return f;
 if(p.s==='kv'&&w.t>=30)f*=1.15;if((p.id==='it2'||p.id==='it4')&&w.t>=30)f*=1.1;
 if(w.rain){if(per(p))f*=.92;if(p.s==='kv')f*=.9}return f}
function wxWhy(p,from,to){for(let d=from;d<to;d++){if(isHol(d))return`${fmtD(d)} είναι αργία, έρχεται λιγότερος κόσμος`;const w=WX[d];if(!w)continue;
 if(w.t>=30&&(p.s==='kv'||p.id==='it2'||p.id==='it4'))return`${relD(d)} έχει ζέστη ${w.t}°, πίνονται περισσότερα κρύα`;
 if(w.rain&&(per(p)||p.s==='kv'))return`${relD(d)} έχει βροχή, έρχεται λιγότερος κόσμος`}return''}

/* ===== Ιστορικό 28 ημερών ===== */
const H={},W={},COF=[];
P.forEach(p=>{H[p.id]=[];W[p.id]=[];
 for(let i=0;i<28;i++){const dw=addD(i-28).getDay(),f=(per(p)?DOW_S:DOW_O)[dw]*(1+(p.trend||0)*(i/27-.5));
  let v=p.b*f*(.8+.4*R());v=p.dec?Math.round(v*10)/10:Math.round(v);H[p.id].push(v);
  if(per(p)){const bias=p.id==='gs3'?.3:p.id==='gs2'?.12:0,early=i<14?.12:0;W[p.id].push(R()<.18+bias+early?(R()<.35?2:1):0)}}});
for(let i=0;i<28;i++)COF.push(Math.round(760*DOW_O[addD(i-28).getDay()]*(.88+.24*R())));
function avgSame(arr,n){const v=[];for(let k=1;v.length<4&&k<8;k++){const o=n-7*k;if(o>=-28&&o<0)v.push(arr[28+o])}return sum(v)/v.length}
const trendR=id=>{const h=H[id];return Math.min(1.2,Math.max(.85,sum(h.slice(21))/(sum(h.slice(0,21))/3)))};
const fc=(id,n)=>avgSame(H[id],n)*trendR(id)*wxF(PM[id],n);
const revDay=off=>{const i=28+off;return COF[i]*COF_PRICE+sum(P.filter(p=>p.price).map(p=>H[p.id][i]*p.price))};

const S={role:'staff',tab:'home',sup:'gs',adj:{},ap:{kv:{st:'pending',at:'09:12'}},comp:{},showAll:{},check:false,cnt:{},
 flow:null,rcv:{st:'idle'},b:{},q:{},done:{},alerts:[],pin:false,pinIn:'',last:Date.now(),msgOpen:false,calc:{w:3,cost:1.65,red:30,miss:2,marg:0.95,tNow:30,rate:8}};
P.forEach(p=>{if(per(p)&&p.shelf>5){const f=fc(p.id,0);const k=p.use?1.7:1;S.b[p.id]=[{e:Math.round(p.shelf/3),q:Math.round(f*.9*k)},{e:p.shelf-1,q:Math.round(f*.6*k*1.5)}];return}if(per(p)){const f=fc(p.id,0);S.b[p.id]=[{e:0,q:Math.max(0,Math.round(f*.25))+(p.id==='gs3'?3:0)},{e:1,q:Math.round(f*.7)},{e:2,q:Math.round(f*.4)}].filter(x=>x.q>0)}});
Object.assign(S.q,{fs1:12,fs2:5,fs3:9,fs4:4,it1:30,it5:3,it6:1.5,it7:2,it8:1,it9:2,it10:1.5,it11:1,it12:.6,it13:3,it2:2800,it3:1300,it4:3100,kv1:40,kv2:22,kv3:9,kv4:6});

/* ===== Πρόβλεψη παραγγελίας ===== */
function nextOrder(s,from=0){for(let d=from;d<from+14;d++)if(SUP[s].days.includes(addD(d).getDay()))return d}
function sim(id,until){let bs=S.b[id].map(x=>({...x})).sort((a,b)=>a.e-b.e),waste=0;
 for(let d=0;d<until;d++){let dem=fc(id,d);for(const x of bs){if(dem<=0)break;if(x.e<d)continue;const t=Math.min(x.q,dem);x.q-=t;dem-=t}
  for(const x of bs)if(x.e<=d&&x.q>0){waste+=x.q;x.q=0}bs=bs.filter(x=>x.q>.01)}return{bs,waste}}
function sugg(id){const p=PM[id],sp=SUP[p.s],o=nextOrder(p.s),del=o+sp.lead,o2=nextOrder(p.s,o+1),del2=o2+sp.lead;
 let dem=0,base=0;for(let d=del;d<del2;d++){dem+=fc(id,d);base+=fc(id,d)/wxF(p,d)}const wx=base?dem/base:1;
 if(per(p)){const end=Math.min(del2,del+p.shelf);if(end<del2){dem=0;for(let d=del;d<end;d++)dem+=fc(id,d)}
  const r=sim(id,del),have=Math.round(sum(r.bs.filter(x=>x.e>=del).map(x=>x.q))),raw=Math.max(0,Math.ceil(dem*1.12+.5-have)),need=p.box&&raw?Math.ceil(raw/p.box)*p.box:raw;
  return{raw,o,del,del2,end,dem,have,wx,need,safe:Math.max(0,raw-Math.max(0,Math.round(dem)-have)),waste:Math.round(r.waste)}}
 let use=0;for(let d=0;d<del;d++)use+=fc(id,d);const have=Math.max(0,S.q[id]-use);
 return{o,del,del2,dem,have,wx,need:Math.max(0,Math.ceil((dem*1.15-have)/p.pack)),waste:0}}
const qtyOf=id=>S.adj[id]??sugg(id).need;
const fmtN=(p,v)=>p.dec?(Math.round(v*10)/10).toString().replace('.',','):Math.round(v).toLocaleString('el-GR');
const orderCost=s=>sum(P.filter(p=>p.s===s).map(p=>qtyOf(p.id)*p.cost));
const expiring=n=>P.filter(per).map(p=>({p,q:sum(S.b[p.id].filter(x=>x.e===n).map(x=>x.q))})).filter(x=>x.q>0);
const pendingCount=()=>Object.values(S.ap).filter(a=>a.st==='pending').length;

/* Εξήγηση σε απλά ελληνικά */
function explain(p){const x=sugg(p.id),last=(x.end||x.del2)-1,span=last===x.del?relD(x.del):`${relD(x.del)} έως ${fmtD(last)}`;
 let main;
 if(per(p)){const dem=Math.round(x.dem);
  main=`${p.use?'Θα χρειαστείς':'Θα πουληθούν'} περίπου <b>${dem}${p.unit?' '+p.unit:''}</b> ${span}. Θα έχεις ήδη <b>${x.have}</b> που δεν θα έχουν λήξει`+
   (x.need===0?`, άρα <b>δεν χρειάζεται</b> παραγγελία.`:dem<=x.have?`, άρα φτάνουν. Βάζουμε μόνο <b>+${x.need}</b> για σιγουριά.`:`, άρα λείπουν ${dem-x.have}`+(x.safe?` και βάζουμε <b>+${x.safe}</b> για σιγουριά.`:`.`));}
 else{main=`Θα χρειαστείς περίπου <b>${fmtN(p,x.dem)} ${p.unit||'τεμ.'}</b> ${span}. Θα σου έχουν μείνει <b>${fmtN(p,x.have)}</b>`+
   (x.need===0?`, άρα <b>φτάνουν</b>.`:`, άρα χρειάζεσαι <b>${x.need} ${p.packN}</b> (με ένα μικρό περιθώριο).`);}
 const rs=[];
 if(x.waste>0)rs.push(['warn',p.use?`${x.waste} ${p.unit} θα λήξουν πριν χρησιμοποιηθούν. Άνοιξε πρώτα αυτά που λήγουν.`:`${x.waste} ${x.waste===1?'θα λήξει':'θα λήξουν'} πριν πουληθούν. Βάλ' τα μπροστά σήμερα${p.combo?` και πρότεινέ τα με το combo «${p.combo}»`:''}.`]);
 const wp=Math.round((x.wx-1)*100),why=wxWhy(p,x.del,x.del2);
 if(Math.abs(wp)>=4&&why)rs.push(['info',`${wp>0?'+':'−'}${Math.abs(wp)}% στην πρόβλεψη: ${why}.`]);
 if(x.end&&x.end<x.del2)rs.push(['n',`Κρατάει ${p.shelf} μέρες, οπότε υπολογίζουμε μόνο μέχρι ${fmtD(x.end-1)} για να μην πεταχτεί.`]);
 if(p.box&&x.need)rs.push(['n',`Χρειάζονται ${x.raw} λίτρα, που στρογγυλεύουν σε ${x.need/p.box} ${x.need/p.box===1?'κιβώτιο':'κιβώτια'} των 8 × 1,5 λίτρα (${x.need} λίτρα).`]);
 if(p.use)rs.push(['n',p.id==='nn1'?'Βγαίνει από τους freddo cappuccino που χτυπάει το ταμείο × ~110 ml αφρόγαλα ο καθένας.':p.id==='nn2'?'Βγαίνει από cappuccino (~150 ml), latte (~200 ml) και flat white (~130 ml) που χτυπάει το ταμείο.':p.id==='nn3'?'Βγαίνει από τα ροφήματα που χτυπήθηκαν «χωρίς λακτόζη» στο ταμείο.':'Βγαίνει από τους φυσικούς χυμούς που χτυπάει το ταμείο × 2–3 πορτοκάλια ο καθένας (~0,4 κιλά).']);
 const tr=trendR(p.id);if(tr>=1.1)rs.push(['n','Πουλάει περισσότερο τις τελευταίες μέρες, η πρόβλεψη το έχει υπόψη.']);
 if(tr<=.9)rs.push(['n','Πουλάει λιγότερο τις τελευταίες μέρες, η πρόβλεψη το έχει υπόψη.']);
 if(S.adj[p.id]!==undefined&&S.adj[p.id]!==x.need)rs.push(['n',`Άλλαξες την πρόταση από ${x.need} σε ${S.adj[p.id]}.`]);
 return{main,rs,attn:rs.some(r=>r[0]!=='n')||tr>=1.1||tr<=.9||S.adj[p.id]!==undefined}}

 Object.keys(SUP).forEach(s=>{const sp=SUP[s],a=S.ap[s];
  if(a&&a.st==='pending')T.push({id:'wait-'+s,lvl:'norm',when:a.at,title:`${sp.name}: περιμένει έγκριση`,why:'Θα ειδοποιηθείς μόλις την εγκρίνει ο διαχειριστής.',act:''});
  if(a&&a.st==='approved')T.push({id:'send-'+s,lvl:'urgent',when:'Τώρα',title:`Εγκρίθηκε η παραγγελία ${sp.name}: στείλ' την`,why:'Το μήνυμα είναι έτοιμο. Ένα πάτημα για Viber, WhatsApp ή email.',
   act:`<button class="btn sm" data-a="goSend" data-v="${s}">Στείλε</button>`});
  if(a&&a.st==='sent')T.push({id:'sent-'+s,lvl:'norm',when:a.at,title:`${sp.name}: στάλθηκε`,why:'',act:'',isDone:true});
 });
 if(Object.keys(SUP).some(s=>S.done['rcv-'+s]))T.push({id:'rcvdone',lvl:'norm',when:'',title:`Παραλήφθηκαν: ${Object.keys(SUP).filter(s=>S.done['rcv-'+s]).map(s=>SUP[s].name).join(', ')}`,why:'',act:'',isDone:true});
 T.push({id:'check',lvl:'norm',when:'Εβδομάδα',title:'Έλεγχος ψυγείου (μία φορά την εβδομάδα)',why:'Η εφαρμογή σου λέει τι πρέπει να έχεις. Εσύ απλώς επιβεβαιώνεις ή διορθώνεις, για να μένουν σωστές οι προβλέψεις.',
  act:`<button class="btn sm ghost" data-a="goCheck">Ξεκίνα τον έλεγχο</button>`});
 return T}

 <p class="sub">${g.o===0?`Στέλνεται σήμερα έως ${sp.cut}`:`Επόμενη παραγγελία ${fmtD(g.o)}`}, έρχεται ${relD(g.del)} και πρέπει να φτάσει μέχρι την επόμενη παράδοση (${fmtD(g.del2)}).</p>`;

 case'cinc':S.cnt[v]=(S.cnt[v]??stockOf(v))+1;break;
 case'cdec':S.cnt[v]=Math.max(0,(S.cnt[v]??stockOf(v))-1);break;
 case'checkSave':{let fx=0;Object.entries(S.cnt).forEach(([id,c])=>{let d=c-stockOf(id);if(!d)return;fx++;const bs=S.b[id].sort((x,y)=>x.e-y.e);
  if(d>0){if(bs.length)bs[bs.length-1].q+=d;else bs.push({e:PM[id].shelf-1,q:d})}else{for(const x of bs){const k=Math.min(x.q,-d);x.q-=k;d+=k;if(!d)break}S.b[id]=bs.filter(x=>x.q>0)}});
  S.check=false;S.done.check=true;render();toast(fx?`Έτοιμο, ${fx} διορθώσεις`:'Όλα σωστά');return}
 case'photo':$('#cam').click();return;
 case'sample':startScan();return;
 case'rinc':S.rcv.lines[v].q++;break;
 case'rdec':S.rcv.lines[v].q=Math.max(0,S.rcv.lines[v].q-1);break;
 case'rsave':{const s=S.rcv.sup,miss=[];S.rcv.lines.forEach(l=>{const p=PM[l.id];if(l.q<l.ord)miss.push(`${l.ord-l.q} ${p.n.toLowerCase()}`);if(!l.q)return;
  if(per(p))S.b[p.id].push({e:p.shelf,q:l.q});else S.q[p.id]+=l.q*p.pack});
  if(miss.length)S.alerts.push(`Παραλαβή ${SUP[s].name} (${S.rcv.no}): έλειπαν ${miss.join(', ')}. Έλεγξε ότι δεν θα χρεωθούν.`);
  S.done['rcv-'+s]=true;S.flow=null;go('home');toast(miss.length?'Καταχωρήθηκε. Ο διαχειριστής ενημερώθηκε για ό,τι λείπει':'Η παραλαβή καταχωρήθηκε');return}
 case'msgToggle':S.msgOpen=!S.msgOpen;break;
 case'recToggle':S.recOpen=!S.recOpen;break;
 case'openCalc':S.flow='calc';render();window.scrollTo(0,0);return;
 case'cin':case'cde':{const f=CF.find(x=>x.k===v),c=S.calc;c[v]=Math.max(f.min,Math.min(f.max,Math.round((c[v]+(a==='cin'?f.st:-f.st))*100)/100));break}
 }render()});
$('#cam').addEventListener('change',e=>{if(e.target.files.length)startScan();e.target.value=''});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
